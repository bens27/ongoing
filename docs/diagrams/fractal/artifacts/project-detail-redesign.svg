<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="graphite" data-theme-appearance="light">
  <title id="title">Ongoing / One project, two compositions</title><desc id="description">One shared overview model and one focused history read feed a set of section components, composed compactly as the inventory panel and wide as the /p/&lt;slug&gt; fact sheet. Catalog validation, optimistic mutation and undo stay where they were; the overview only chooses what to say first.. Architecture structure.</desc>
