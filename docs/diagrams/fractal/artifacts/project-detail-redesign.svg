      <text x="45" y="78" font-size="12" font-weight="400" fill="#6d6d68"></text>
      </g><path d="M263,589.5 L484.1,589.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M742.1,589.5 L758.1,589.5 L758.1,345.5 L963.2,345.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M742.1,589.5 L963.2,589.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,320 L452.1,320 L452.1,589.5 L484.1,589.5" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M263,320 L279,320 L279,213 L484.1,213" fill="none" stroke="#85857f" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="project-detail-summary"><rect x="50" y="457" width="212" height="265" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 474) scale(0.667)" color="#89A579" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="489" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Shared overview</tspan><tspan x="70" dy="20">model</tspan></text>
      <text x="70" y="534" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Pure projectOverview:</tspan><tspan x="70" dy="17">identity, the primary</tspan><tspan x="70" dy="17">attention item with its</tspan><tspan x="70" dy="17">action and evidence,</tspan><tspan x="70" dy="17">disjoint activity rates,</tspan><tspan x="70" dy="17">section summaries,</tspan><tspan x="70" dy="17">inspector rows.</tspan><tspan x="70" dy="17">selectPriority ranks</tspan><tspan x="70" dy="17">classified reasons into five</tspan><tspan x="70" dy="17">documented tiers; nothing</tspan><tspan x="70" dy="17">invents a task or a score.</tspan></text>
      </g><g data-element="project-detail-history"><rect x="485.09999999999997" y="89" width="212" height="248" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(671.1 106) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="121" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Focused history</tspan><tspan x="505.1" dy="20">read</tspan></text>
      <text x="505.1" y="166" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">One application function</tspan><tspan x="505.1" dy="17">over listSnapshots behind</tspan><tspan x="505.1" dy="17">GET</tspan><tspan x="505.1" dy="17">/api/entries/:kind/:slug/his</tspan><tspan x="505.1" dy="17">tory and ongoing history:</tspan><tspan x="505.1" dy="17">bounded window, dated</tspan><tspan x="505.1" dy="17">observations, availability</tspan><tspan x="505.1" dy="17">and freshness stated</tspan><tspan x="505.1" dy="17">separately. No new schema;</tspan><tspan x="505.1" dy="17">contract in docs/cli.md.</tspan></text>
      </g><g data-element="project-detail-charts"><rect x="50" y="215" width="212" height="210" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(236 232) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="70" y="247" font-size="14" font-weight="600" fill="#292927"><tspan x="70" dy="0">Dated charts</tspan></text>
      <text x="70" y="271" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="70" dy="0">Observations placed by</tspan><tspan x="70" dy="17">capture date, gaps dashed,</tspan><tspan x="70" dy="17">nulls breaking the line, a</tspan><tspan x="70" dy="17">text summary for every</tspan><tspan x="70" dy="17">state. Lazy reads per</tspan><tspan x="70" dy="17">visible tab, cached by</tspan><tspan x="70" dy="17">entry, metric, window and</tspan><tspan x="70" dy="17">freshness; late responses</tspan><tspan x="70" dy="17">ignored.</tspan></text>
      </g><g data-element="project-detail-sections"><rect x="485.09999999999997" y="491" width="256" height="197" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(715.1 508) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="505.1" y="523" font-size="14" font-weight="600" fill="#292927"><tspan x="505.1" dy="0">Reusable sections and</tspan><tspan x="505.1" dy="20">inspector</tspan></text>
      <text x="505.1" y="568" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="505.1" dy="0">src/lib/ui/project: identity,</tspan><tspan x="505.1" dy="17">priority, signal tabs, Reach, four</tspan><tspan x="505.1" dy="17">disclosures, the actions menu and</tspan><tspan x="505.1" dy="17">the searchable field inspector.</tspan><tspan x="505.1" dy="17">Both compositions render these</tspan><tspan x="505.1" dy="17">components; every edit is an</tspan><tspan x="505.1" dy="17">optimistic patch through Catalog.</tspan></text>
      </g><g data-element="project-detail-panel"><rect x="964.1999999999998" y="257.5" width="212" height="176" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1150.2 274.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="984.2" y="289.5" font-size="14" font-weight="600" fill="#292927"><tspan x="984.2" dy="0">Inventory panel</tspan></text>
      <text x="984.2" y="313.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="984.2" dy="0">ProjectPanel stacks the</tspan><tspan x="984.2" dy="17">sections in the shared Panel</tspan><tspan x="984.2" dy="17">shell at 520px, falling back</tspan><tspan x="984.2" dy="17">to 400px below 1366px.</tspan><tspan x="984.2" dy="17">Disclosure, tab and</tspan><tspan x="984.2" dy="17">pending-edit state are</tspan><tspan x="984.2" dy="17">keyed by entry id.</tspan></text>
      </g><g data-element="project-detail-factsheet"><rect x="964.1999999999998" y="465.5" width="212" height="248" rx="14" fill="#ffffff" stroke="#d5d5d0" stroke-width="1.3"/>
      <g transform="translate(1150.2 482.5) scale(0.667)" color="#759EB5" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="984.2" y="497.5" font-size="14" font-weight="600" fill="#292927"><tspan x="984.2" dy="0">Project fact</tspan><tspan x="984.2" dy="20">sheet</tspan></text>
      <text x="984.2" y="542.5" font-size="12" font-weight="400" fill="#6d6d68"><tspan x="984.2" dy="0">/p/&lt;slug&gt;: identity beside</tspan><tspan x="984.2" dy="17">priority, Activity/Codebase</tspan><tspan x="984.2" dy="17">with Work and Repository</tspan><tspan x="984.2" dy="17">left, Reach with Stack and</tspan><tspan x="984.2" dy="17">Notes right, one column in</tspan><tspan x="984.2" dy="17">DOM order below 860px.</tspan><tspan x="984.2" dy="17">Returns to the inventory</tspan><tspan x="984.2" dy="17">with its query, sort,</tspan><tspan x="984.2" dy="17">columns, selection and</tspan><tspan x="984.2" dy="17">scroll intact.</tspan></text>
      </g><g><rect x="312.375" y="595.5" width="122.34999999999998" height="68" rx="5" fill="#f8f8f6"/><text x="373.55" y="608.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.55" dy="0">One reading model:</tspan><tspan x="373.55" dy="15">summaries, actions,</tspan><tspan x="373.55" dy="15">evidence, inspector</tspan><tspan x="373.55" dy="15">rows</tspan></text></g><g><rect x="790.0999999999999" y="320.5" width="125.09999999999997" height="23" rx="5" fill="#f8f8f6"/><text x="852.6499999999999" y="333.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="852.6499999999999" dy="0">Compact composition</tspan></text></g><g><rect x="813.9149999999998" y="595.5" width="77.47" height="38" rx="5" fill="#f8f8f6"/><text x="852.6499999999999" y="608.5" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="852.6499999999999" dy="0">Spacious</tspan><tspan x="852.6499999999999" dy="15">composition</tspan></text></g><g><rect x="323.925" y="326" width="99.24999999999999" height="53" rx="5" fill="#f8f8f6"/><text x="373.55" y="339" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.55" dy="0">The Reach and</tspan><tspan x="373.55" dy="15">Codebase chart</tspan><tspan x="373.55" dy="15">slots</tspan></text></g><g><rect x="311" y="219" width="125.09999999999997" height="83" rx="5" fill="#f8f8f6"/><text x="373.54999999999995" y="232" text-anchor="middle" font-size="11" fill="#62625e"><tspan x="373.54999999999995" dy="0">Lazily, for the</tspan><tspan x="373.54999999999995" dy="15">visible tab; cached</tspan><tspan x="373.54999999999995" dy="15">by entry, metric,</tspan><tspan x="373.54999999999995" dy="15">window and</tspan><tspan x="373.54999999999995" dy="15">collector freshness</tspan></text></g></g>
