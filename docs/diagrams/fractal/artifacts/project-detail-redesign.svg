  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#626b6f">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#292927"><tspan x="96" dy="0">Ongoing / One project, two compositions</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#74746f"><tspan x="96" dy="0">One shared overview model and one focused history read feed a set of section components, composed compactly as the inventory panel and wide as the /p/&lt;slug&gt; fact sheet. Catalog</tspan><tspan x="96" dy="26">validation, optimistic mutation and undo stay where they were; the overview only chooses what to say first.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(377.157 236) scale(0.951)"><g data-element="project-detail-redesign"><rect x="25" y="24" width="1176.1999999999998" height="722" rx="14" fill="#eeeeeb" stroke="#d5d5d0" stroke-width="1.3"/>
